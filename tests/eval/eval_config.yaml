# Evaluation of the SF permit assistant vs. the single-prompt baseline.
# Run everything with: bash scripts/run_eval.sh   (see README)
metrics_to_run:
  - custom_response_quality   # LLM judge 1-5 vs. expected behaviour (pass = >= 4)
  - expected_tools            # share of expected tools called (0-1)
  - source_and_disclaimer     # disclaimer + expected official source cited (0-1)
  - unnecessary_action        # 1 = draft/send not requested, or claims a dossier was sent
  - tool_errors               # tool misuse (invalid args, guardrail refusals)
  - tool_call_count           # number of tool calls

thresholds:
  custom_response_quality: 3.5

custom_metrics:
  - name: custom_response_quality
    custom_function_file: response_quality.py
  - name: expected_tools
    custom_function_file: expected_tools.py
  - name: source_and_disclaimer
    custom_function_file: source_and_disclaimer.py
  - name: unnecessary_action
    custom_function_file: unnecessary_action.py
  - name: tool_errors
    custom_function_file: tool_metrics.py
  - name: tool_call_count
    custom_function: |
      def evaluate(instance):
          n = 0
          for turn in (instance.get("agent_data") or {}).get("turns", []):
              for event in turn.get("events", []):
                  for part in (event.get("content") or {}).get("parts", []):
                      if "function_call" in part:
                          n += 1
          return {'score': n}
