# Builds the Project 2 fraud-detection API image (its self-contained
# Dockerfile.demo trains the XGBoost model at build time from the public OpenML
# mirror and bakes it into the image).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.demo", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
