name: CI

# Runs without any Google Cloud credentials: lint + unit tests (SQL, MCP, RAG
# with the offline embedder, guardrails, human validation).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install dependencies
        run: uv sync --locked --python 3.11
      - name: Lint
        run: uvx ruff check app mcp_server baseline frontend tests scripts
      - name: Unit tests
        env:
          RAG_EMBEDDINGS: local
        run: uv run pytest tests/unit -q
