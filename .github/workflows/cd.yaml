name: CD

# On every push to main: unit tests, then redeploy the agent on Cloud Run.
# Authentication: Workload Identity Federation (no key stored on GitHub), limited
# to the main branch of this repository. The Gemini key stays in Secret Manager
# and the service keeps its env vars / secrets / CPU settings across deploys.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "mcp_server/**"
      - "baseline/**"
      - "data/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  PROJECT_ID: project-0486c82e-e154-4151-987
  REGION: us-west1
  SERVICE: sf-permit-assistant
  WIF_PROVIDER: projects/62689813869/locations/global/workloadIdentityPools/github/providers/github-repo
  DEPLOYER_SA: github-deployer@project-0486c82e-e154-4151-987.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.0.0
      - run: uv sync --locked --python 3.11
      - name: Unit tests
        env:
          RAG_EMBEDDINGS: local
        run: uv run pytest tests/unit -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run (build from source with Cloud Build)
        run: |
          gcloud run deploy "$SERVICE" --source . --region "$REGION" --project "$PROJECT_ID" \
            --timeout 1800 --update-env-vars "AGENT_VERSION=${GITHUB_SHA::7}" --quiet
